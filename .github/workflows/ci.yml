# Pull requests: the shared checks (build, tests, lint, read-only plan; checks.yml), the security scans
# (scan.yml) and dependency review. Nothing here can change AWS.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    secrets:
      AWS_PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
    permissions:
      contents: read
      id-token: write

  scan:
    name: Security scans
    uses: ./.github/workflows/scan.yml
    permissions:
      contents: read
      security-events: write # CodeQL results; the other scanners don't upload on PRs (sarif: false)
    with:
      sarif: false

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
