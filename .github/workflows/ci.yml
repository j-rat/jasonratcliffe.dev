# Pull requests: build + PII scan the site, test the Lambda, lint Terraform,
# and produce a Terraform plan with the read-only plan role.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.6
  NODE_VERSION: 24
  AWS_REGION: us-east-1

jobs:
  site:
    name: Site build + PII scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx astro check
      # build = astro build + PDF render + PII scan (fails on any email/phone/address/account ID)
      - run: npm run build

  lambda:
    name: Contact Lambda tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest -v
        working-directory: infra/main/lambda/contact

  terraform-lint:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra
      - name: validate
        run: |
          for stack in bootstrap main; do
            terraform -chdir=infra/$stack init -backend=false -input=false
            terraform -chdir=infra/$stack validate
          done

  terraform-plan:
    name: Terraform plan (read-only role)
    runs-on: ubuntu-latest
    needs: [terraform-lint]
    # Secrets are not available to PRs from forks; skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
    concurrency:
      group: terraform-state
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_contact_to_email: ${{ secrets.CONTACT_TO_EMAIL }}
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: terraform plan
        # Full plan output contains ARNs and resource names, so it is not printed.
        # Only resource addresses and actions go to the job summary.
        run: |
          terraform plan -lock-timeout=5m -out=tfplan -no-color > plan.log 2>&1 || { tail -n 40 plan.log | sed -E 's/[0-9]{12}/************/g'; exit 1; }
          {
            echo "### Terraform plan"
            echo
            echo '| Action | Resource |'
            echo '|---|---|'
            terraform show -json tfplan | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "| \(.change.actions | join(", ")) | `\(.address)` |"'
            echo
            grep -E '^(Plan:|No changes)' plan.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f plan.log tfplan
