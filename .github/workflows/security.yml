# Weekly sweep (Mondays) and on demand: every scanner again (new rules, new advisories), secrets over the full
# history, and a passive ZAP baseline against the live site. CodeQL and the per-change scans run from scan.yml
# on every pull request and deploy. Results go to the Security tab.
name: security

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: true

env:
  SITE_URL: https://jasonratcliffe.dev/
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

jobs:
  weekly-scan:
    name: Weekly scan
    uses: ./.github/workflows/scan.yml
    permissions:
      contents: read
      security-events: write
    with:
      sarif: true
      full-history: true

  zap-production:
    name: DAST (ZAP baseline, production, passive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ZAP baseline
        # Passive only: crawls and reads responses, never sends attack payloads (no active scan against production).
        # These requests will show up on /edge/ like any other visitor's; that's accepted for a weekly run.
        run: |
          mkdir -p zap && chmod 777 zap && cp .github/security/zap-prod.tsv zap/rules.tsv
          rc=0
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$SITE_URL" -c rules.tsv -m 3 -I -J report.json -r report.html | tee zap/out.txt || rc=${PIPESTATUS[0]}
          {
            echo "### ZAP baseline ($SITE_URL)"
            echo "Rules marked IGNORE in .github/security/zap-prod.tsv are left out; FAIL lines are what blocks."
            echo '```'
            grep -E '^(FAIL|WARN)' zap/out.txt || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-production
          path: zap/report.html
          retention-days: 30
          if-no-files-found: ignore
