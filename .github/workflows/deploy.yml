# main branch:
#   checks  (checks.yml)  build, tests, lint, then a read-only Terraform plan and the list of site files that
#                         would change. Read its summary before approving.
#   scan    (scan.yml)    security scans; a blocking finding stops the deploy before the approval gate.
#   deploy                ONE approval-gated job (environment: production). Applies Terraform only if the plan
#                         had changes, and only if a fresh plan matches the one you approved; then publishes to
#                         S3, invalidates CloudFront and smoke-tests the live site.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.6
  AWS_REGION: us-east-1
  SITE_DOMAIN: jasonratcliffe.dev

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    secrets:
      AWS_PLAN_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
    permissions:
      contents: read
      id-token: write

  scan:
    name: Security scans
    uses: ./.github/workflows/scan.yml
    permissions:
      contents: read
      security-events: write
    with:
      sarif: true

  deploy:
    name: Apply + publish
    runs-on: ubuntu-latest
    needs: [checks, scan]
    environment:
      name: production
      url: https://jasonratcliffe.dev/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-state
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_contact_to_email: ${{ secrets.CONTACT_TO_EMAIL }}
      TF_CHANGES: ${{ needs.checks.outputs.tf_changes }}
      APPROVED_FINGERPRINT: ${{ needs.checks.outputs.tf_fingerprint }}
      SITE_CHANGES: ${{ needs.checks.outputs.site_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: terraform init
        working-directory: infra/main
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: terraform apply (the approved plan only)
        id: apply
        if: env.TF_CHANGES != '0'
        working-directory: infra/main
        run: |
          test -n "$APPROVED_FINGERPRINT" || { echo "::error::No approved plan from the checks job."; exit 1; }
          terraform plan -lock-timeout=5m -out=tfplan -no-color > plan.log 2>&1 || { tail -n 40 plan.log | sed -E 's/[0-9]{12}/************/g'; exit 1; }
          now=$(../../.github/scripts/plan-changes.sh tfplan | sha256sum | cut -c1-64)
          if [ "$now" != "$APPROVED_FINGERPRINT" ]; then
            echo "::error::The plan changed after approval (state or main moved). Nothing was applied. Re-run the workflow to plan and approve again."
            exit 1
          fi
          terraform apply -lock-timeout=5m -no-color tfplan > apply.log 2>&1 || { tail -n 40 apply.log | sed -E 's/[0-9]{12}/************/g'; exit 1; }
          grep -E '^Apply complete' apply.log | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f apply.log plan.log tfplan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist
      - name: Read deploy targets from Terraform outputs (masked)
        working-directory: infra/main
        # Masking keeps resource names out of public logs; they are not credentials. Semgrep warns that a copied
        # workflow on another branch could stop masking; this job only runs on main after approval (nosemgrep below).
        run: |
          bucket=$(terraform output -raw site_bucket)
          dist_id=$(terraform output -raw distribution_id)
          echo "::add-mask::$bucket"  # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "::add-mask::$dist_id"  # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          edge_fn=$(terraform output -raw edge_report_function)
          echo "::add-mask::$edge_fn"  # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "SITE_BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$dist_id" >> "$GITHUB_ENV"
          echo "EDGE_REPORT_FUNCTION=$edge_fn" >> "$GITHUB_ENV"
      - name: Upload fingerprinted assets (immutable, kept for old pages)
        run: |
          aws s3 sync dist/_astro "s3://$SITE_BUCKET/_astro" \
            --cache-control "public,max-age=31536000,immutable" --only-show-errors
      - name: Upload pages and files (revalidate)
        run: |
          aws s3 sync dist "s3://$SITE_BUCKET" --delete --exclude "_astro/*" --exclude "data/*" \
            --cache-control "public,max-age=300,must-revalidate" --only-show-errors
      - name: Refresh edge report
        id: edge
        # Runs before the invalidation so the fresh data/edge-threats.json is served right away.
        # A failure only warns: the site is already published and the daily schedule retries.
        run: |
          if aws lambda invoke --function-name "$EDGE_REPORT_FUNCTION" --payload '{}' \
               --cli-binary-format raw-in-base64-out --query FunctionError --output text edge-report.json > invoke.txt \
             && ! grep -qv '^None$' invoke.txt; then
            echo "result=refreshed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed (previous data kept; the daily run retries)" >> "$GITHUB_OUTPUT"
            echo "::warning::Edge report Lambda failed; /edge/ keeps the previous data until the daily run."
          fi
          rm -f edge-report.json invoke.txt
      - name: Invalidate CloudFront
        id: invalidate
        run: |
          start=$SECONDS
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' --query Invalidation.Id --output text)
          echo "::add-mask::$id"  # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
          echo "seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
      - name: Deploy summary
        env:
          APPLY: ${{ steps.apply.outcome }}
          EDGE: ${{ steps.edge.outputs.result }}
          INVALIDATION_SECONDS: ${{ steps.invalidate.outputs.seconds }}
          COMMIT: ${{ github.sha }}
        run: |
          case "$APPLY" in
            success) tf="applied $TF_CHANGES change(s), matching the approved plan" ;;
            skipped) tf="no changes, skipped" ;;
            *)       tf="$APPLY" ;;
          esac
          {
            echo "### Deployed ${COMMIT:0:7} to https://$SITE_DOMAIN/"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Terraform | $tf |"
            echo "| Site files | ${SITE_CHANGES:-unknown} |"
            echo "| Edge report | ${EDGE:-not run} |"
            echo "| CloudFront invalidation | ${INVALIDATION_SECONDS:-?}s |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        run: .github/scripts/smoke-test.sh "$SITE_DOMAIN" "$SITE_BUCKET"
