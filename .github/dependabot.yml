version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ['*'] }
    ignore:
      # @astrojs/check peers on typescript ^5 || ^6; drop this once it accepts 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: terraform
    directories: [/infra/bootstrap, /infra/main]
    schedule: { interval: weekly }
