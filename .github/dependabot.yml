version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # let new releases age a week before proposing them
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # let new releases age a week before proposing them
    groups:
      npm: { patterns: ['*'] }
    ignore:
      # @astrojs/check peers on typescript ^5 || ^6; drop this once it accepts 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: terraform
    directories: [/infra/bootstrap, /infra/main]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # let new releases age a week before proposing them
  - package-ecosystem: npm
    directory: /tools/log-viewer
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      npm: { patterns: ['*'] }
  # Scanner CLIs (hash-pinned pip-compile lock). The ZAP image digest and the TruffleHog version in
  # .github/workflows/scan.yml are bumped by hand.
  - package-ecosystem: pip
    directory: /.github/security
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      scanners: { patterns: ['*'] }
